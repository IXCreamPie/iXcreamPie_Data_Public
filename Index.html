<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Public Data Cells</title>
<style>
body { font-family: Arial; padding: 20px; }
.cell {
  border: 2px solid #000;
  padding: 10px;
  margin-bottom: 8px;
}
</style>
</head>
<body>

<h2>Public Data</h2>
<div id="cells"></div>

<script>
const data = JSON.parse(localStorage.getItem("IX_PUBLIC_DATA"));
const container = document.getElementById("cells");

if (!data) {
  container.innerHTML = "No data found.";
} else {
  container.innerHTML = `
    <div class="cell"><b>Name:</b> ${data.name}</div>
    <div class="cell"><b>Photo:</b> ${data.photo}</div>
    <div class="cell"><b>Top Button:</b> ${data.topButton}</div>
    <div class="cell"><b>Bottom Button:</b> ${data.bottomButton}</div>
    ${data.schedule.map((s,i)=>`
      <div class="cell"><b>Slot ${i+1}:</b> ${s}</div>
    `).join("")}
  `;
}
</script>

</body>
</html>
